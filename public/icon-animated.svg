<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/> <!-- Green/Emerald -->
      <stop offset="100%" stop-color="#06B6D4"/> <!-- Cyan -->
    </linearGradient>

    <!-- Inner Glow/Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Node Glow Filter -->
    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulse-shield {
        0%, 100% { opacity: 0.8; stroke-width: 14px; }
        50% { opacity: 1; stroke-width: 18px; filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.5)); }
      }
      @keyframes flow-pulse {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      @keyframes pulse-node {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      .animated-shield {
        animation: pulse-shield 3s infinite ease-in-out;
      }
      .animated-pulse-wave {
        stroke-dasharray: 40 20;
        animation: flow-pulse 2s infinite linear;
      }
      .animated-node-cyan {
        animation: pulse-node 2s infinite ease-in-out;
        transform-origin: 220px 136px;
      }
      .animated-node-green {
        animation: pulse-node 2.5s infinite ease-in-out;
        transform-origin: 250px 376px;
      }
      .animated-node-cyan-small {
        animation: pulse-node 1.8s infinite ease-in-out;
        transform-origin: 280px 216px;
      }
    </style>
  </defs>

  <!-- Background Plate -->
  <rect width="512" height="512" rx="128" fill="#080a0f" stroke="rgba(255, 255, 255, 0.04)" stroke-width="6"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="rgba(6, 182, 212, 0.03)" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- Outer Shield Outline representing safety and containment -->
  <polygon 
    points="256,50 426,148 426,364 256,462 86,364 86,148" 
    fill="rgba(7, 10, 15, 0.6)" 
    stroke="url(#brand-grad)" 
    stroke-width="16" 
    stroke-linejoin="round"
    filter="url(#glow)"
    class="animated-shield"
  />

  <!-- Inner Echo Hexagon Lines for network grid feel -->
  <polygon 
    points="256,86 394,166 394,346 256,426 118,346 118,166" 
    fill="none" 
    stroke="rgba(255, 255, 255, 0.05)" 
    stroke-width="4" 
    stroke-linejoin="round"
  />

  <!-- The Main Pulse Wave representation (heartbeat/triage) -->
  <path 
    d="M 120,256 L 190,256 L 220,136 L 250,376 L 280,216 L 310,296 L 340,256 L 392,256" 
    fill="none" 
    stroke="url(#brand-grad)" 
    stroke-width="28" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#glow)"
    class="animated-pulse-wave"
  />

  <!-- Active Semantic Triage Nodes (glowing points) -->
  <circle cx="220" cy="136" r="14" fill="#06B6D4" filter="url(#node-glow)" class="animated-node-cyan" />
  <circle cx="250" cy="376" r="14" fill="#10B981" filter="url(#node-glow)" class="animated-node-green" />
  <circle cx="280" cy="216" r="10" fill="#06B6D4" filter="url(#node-glow)" class="animated-node-cyan-small" />
</svg>
